plugins {
    id 'java'
    id 'com.microsoft.azure.azurefunctions' version '1.11.0'  // Azure Functions plugin
}

group = 'com.example'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    // Azure Functions Java library
    implementation 'com.microsoft.azure.functions:azure-functions-java-library:1.4.2'

    // Spring Boot Starter Web for REST Controller and Mappings
    implementation 'org.springframework.boot:spring-boot-starter-web:2.7.12' // Specify a compatible version

    // AssertJ for fluent assertions in tests
    testImplementation 'org.assertj:assertj-core:3.24.2'

    // JUnit 5 for testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17) // Ensure it matches your Java version
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}