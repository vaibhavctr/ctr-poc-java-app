plugins {
    id 'java'
    id 'com.microsoft.azure.azurefunctions' version '1.11.0'  // Azure Functions plugin
}

group = 'com.example'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.microsoft.azure.functions:azure-functions-java-library:1.4.2' // Azure Functions Java library
    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.1' // JUnit for testing
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17) // Ensure it matches your Java version
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}